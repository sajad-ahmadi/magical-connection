<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="circleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="150" fill="url(#glow)"/>

  <circle cx="200" cy="200" r="100" fill="none"
          stroke="url(#ringGrad)" stroke-width="2.5"
          stroke-dasharray="10 8" stroke-linecap="round"
          opacity="0.35">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 200 200" to="360 200 200"
                      dur="40s" repeatCount="indefinite"/>
  </circle>

  <circle cx="200" cy="200" r="80" fill="#ffffff"
          stroke="#e2e8f0" stroke-width="1.5"
          filter="url(#circleShadow)"/>

  <g filter="url(#softShadow)">
    <rect x="158" y="158" width="84" height="84" rx="8"
          fill="url(#serverGrad)"/>
    <rect x="158" y="158" width="84" height="84" rx="8"
          fill="none" stroke="#6d28d9" stroke-width="1.5" opacity="0.5"/>

    <rect x="166" y="168" width="68" height="16" rx="3"
          fill="url(#slotGrad)"/>
    <circle cx="224" cy="176" r="2.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <line x1="172" y1="176" x2="196" y2="176"
          stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <rect x="166" y="190" width="68" height="16" rx="3"
          fill="url(#slotGrad)"/>
    <circle cx="224" cy="198" r="2.5" fill="#10b981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <line x1="172" y1="198" x2="196" y2="198"
          stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <rect x="166" y="212" width="68" height="16" rx="3"
          fill="url(#slotGrad)"/>
    <circle cx="224" cy="220" r="2.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="172" y1="220" x2="196" y2="220"
          stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <g opacity="0.35">
    <line x1="176" y1="252" x2="176" y2="262"
          stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="188" y1="252" x2="188" y2="262"
          stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="200" y1="252" x2="200" y2="262"
          stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="212" y1="252" x2="212" y2="262"
          stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="224" y1="252" x2="224" y2="262"
          stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g opacity="0.5">
    <line x1="248" y1="168" x2="258" y2="178"
          stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <line x1="258" y1="168" x2="248" y2="178"
          stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  </g>

  <circle cx="176" cy="320" r="3.5" fill="#c7d2fe">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="320" r="3.5" fill="#a78bfa">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="224" cy="320" r="3.5" fill="#8b5cf6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</svg>